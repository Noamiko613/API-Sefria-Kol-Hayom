
services:
  sefria-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sefria-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sefria-network

  # EXPOSE YOUR API WORLDWIDE WITH INSTATUNNEL (FREE STATIC SUBDOMAIN)
  tunnel:
    image: node:20-alpine
    container_name: sefria-tunnel
    # Command forwards traffic from the public URL to our local 'sefria-api' container
    command: npx -y instatunnel@latest --name ${TUNNEL_NAME:-kolhayom-siddur-api} --port 3000 --local-host sefria-api
    restart: unless-stopped
    depends_on:
      - sefria-api
    networks:
      - sefria-network

networks:
  sefria-network:
    driver: bridge

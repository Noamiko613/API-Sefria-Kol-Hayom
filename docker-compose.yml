
services:
  sefria-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sefria-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sefria-network

  # EXPOSE YOUR API WORLDWIDE WITH ZROK (STABLE TUNNEL)
  zrok:
    image: openziti/zrok
    container_name: sefria-zrok
    # We join the API's network namespace so 'localhost:3000' routes directly to the API container
    network_mode: "service:sefria-api"
    volumes:
      - ./zrok-state:/tmp/zrok
    environment:
      - HOME=/tmp/zrok
      - ZROK_ENABLE_TOKEN=0hD9JBznYqUN
    user: root
    entrypoint: sh
    command: -c "zrok enable $$ZROK_ENABLE_TOKEN || true; (zrok share reserved kolhayom-final --headless || (zrok reserve public http://localhost:3000 --unique-name kolhayom-final && zrok share reserved kolhayom-final --headless))"
    restart: unless-stopped
    depends_on:
      - sefria-api

networks:
  sefria-network:
    driver: bridge

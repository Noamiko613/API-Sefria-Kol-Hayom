

services:
  sefria-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sefria-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sefria-network

  # EXPOSE YOUR API WORLDWIDE WITH CLOUDFLARE
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sefria-tunnel
    # Final Fix: No 'tunnel' word to avoid token requirements
    command: ["--url", "http://sefria-api:3000", "--no-autoupdate"]
    restart: unless-stopped
    depends_on:
      - sefria-api
    networks:
      - sefria-network

networks:
  sefria-network:
    driver: bridge

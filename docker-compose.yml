
services:
  sefria-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sefria-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sefria-network

  # EXPOSE YOUR API WORLDWIDE WITH INSTATUNNEL (FREE STATIC SUBDOMAIN)
  tunnel:
    image: node:20-alpine
    container_name: sefria-tunnel
    # We join the API's network namespace so 'localhost:3000' routes directly to the API container
    network_mode: "service:sefria-api"
    # The correct syntax for instatunnel is 'tunnel [port] -s [subdomain]'
    # We hardcode the subdomain to avoid PowerShell interpolation errors on the Mini PC
    command: npx -y instatunnel@latest tunnel 3000 -s kolhayom613-dev --api-key ${INSTATUNNEL_KEY:-""}
    restart: unless-stopped
    depends_on:
      - sefria-api

networks:
  sefria-network:
    driver: bridge
